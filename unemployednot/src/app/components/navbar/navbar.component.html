<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" routerLink="/">UnemployedNot</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span style="color:#4caf50; font-size:20px;">&#9776;</span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/jobs" routerLinkActive="active">Jobs</a>
        </li>
        @if (authService.isLoggedIn()) {
          <li class="nav-item">
            <a class="nav-link" routerLink="/applications" routerLinkActive="active">My Applications</a>
          </li>
          <li class="nav-item">
            <span class="nav-link" style="color:#4caf50;">{{ authService.getName() }}</span>
          </li>
          <li class="nav-item">
            <a class="nav-link" style="cursor:pointer;" (click)="logout()">Logout</a>
          </li>
        } @else {
          <li class="nav-item">
            <a class="nav-link" routerLink="/signup" routerLinkActive="active">Sign Up</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/login" routerLinkActive="active">Login</a>
          </li>
        }
        <li class="nav-item">
          <a class="nav-link" routerLink="/contact" routerLinkActive="active">Contact</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
